[project]
name = "pydegas"
version = "0.0.1"
description = "Fit the parameters of probabilistic programs with gradient descent, without sampling."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oguzhan Merttürk" }, { name = "Francesca Randone" }]
keywords = [
    "probabilistic programming",
    "gaussian mixture",
    "differentiable programming",
    "optimization",
    "pytorch",
    "DeGAS",
    "SOGA",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.2",
    "botorch>=0.9.1",
    "numpy>=1.26",
    "scikit-learn>=1.3.1",
    "antlr4-python3-runtime==4.10",
]

[project.urls]
Source = "https://github.com/degas-tool/pydegas"
Issues = "https://github.com/degas-tool/pydegas/issues"
Paper = "https://arxiv.org/abs/2601.15167"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff==0.17.0",
    "mypy>=2.4",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pydegas"]
exclude = ["*.interp", "*.tokens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = ["reference: compares against the DeGAS reference implementation in reference/DeGAS"]
# botorch -> gpytorch -> linear_operator call torch.jit.script on import (not pydegas code)
filterwarnings = ["ignore:.*torch.jit.script.*:DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
exclude = ['^src/pydegas/parse/(soga|asgmt|trunc|degas-loss)/']
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["pydegas.parse.soga.*", "pydegas.parse.asgmt.*", "pydegas.parse.trunc.*"]
follow_imports = "silent"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["antlr4", "antlr4.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true
