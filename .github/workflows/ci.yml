name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  UV_VERSION: "0.11.8"
  UV_LOCKED: "1"
  PRE_COMMIT_VERSION: "4.6.2"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pydegas: ${{ steps.filter.outcome != 'success' || steps.filter.outputs.pydegas == 'true' }}
      api: ${{ steps.filter.outcome != 'success' || steps.filter.outputs.api == 'true' }}
      ui: ${{ steps.filter.outcome != 'success' || steps.filter.outputs.ui == 'true' }}
      docker: ${{ steps.filter.outcome != 'success' || steps.filter.outputs.docker == 'true' }}
    steps:
      - name: Check out the repository
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Filter changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            pydegas:
              - libs/pydegas/**
              - reference/**
              - .gitmodules
              - .github/workflows/ci.yml
              - "!**/*.md"
              - "!libs/pydegas/docs/**"
            api:
              - libs/degas-api/**
              - libs/pydegas/**
              - .github/workflows/ci.yml
              - "!**/*.md"
              - "!libs/*/docs/**"
            ui:
              - libs/degas-ui/**
              - .github/workflows/ci.yml
              - "!**/*.md"
              - "!libs/degas-ui/docs/**"
            docker:
              - .dockerignore
              - compose*.yaml
              - nginx.local.conf
              - libs/pydegas/pyproject.toml
              - libs/degas-api/Dockerfile
              - libs/degas-api/pyproject.toml
              - libs/degas-api/uv.lock
              - libs/degas-api/src/degas_api/migrations/**
              - libs/degas-ui/.dockerignore
              - libs/degas-ui/Dockerfile
              - libs/degas-ui/nginx.conf
              - libs/degas-ui/package.json
              - libs/degas-ui/package-lock.json
              - .github/workflows/ci.yml

      - name: Fall back to running every job
        if: steps.filter.outcome == 'failure'
        run: echo "::warning::Path filtering failed, so every job runs."

  lint:
    name: pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Cache the pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ env.PRE_COMMIT_VERSION }}-${{ runner.os }}-${{ runner.arch }}-py3.12-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run the hooks that need no project environment
        env:
          SKIP: gitleaks,mypy-pydegas,mypy-degas-api,prettier,eslint,tsc
        run: uvx --python 3.12 "pre-commit@${PRE_COMMIT_VERSION}" run --all-files --show-diff-on-failure --color=always

  pydegas:
    name: pydegas (Python ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.pydegas == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: libs/pydegas
    steps:
      - name: Check out the repository and the DeGAS reference
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Install uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          working-directory: libs/pydegas
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: pydegas

      - name: Install the locked environment
        run: uv sync

      - name: Type-check
        if: matrix.python == '3.12'
        run: uv run mypy

      - name: Require the reference submodule
        run: test -f ../../reference/DeGAS/src/libSOGA.py

      - name: Test
        run: uv run pytest

  api:
    name: degas-api
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: libs/degas-api
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          working-directory: libs/degas-api
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: degas-api

      - name: Install the locked environment
        run: uv sync

      - name: Type-check
        run: uv run mypy

      - name: Test
        run: uv run pytest

  ui:
    name: degas-ui
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: libs/degas-ui
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: libs/degas-ui/.nvmrc
          cache: npm
          cache-dependency-path: libs/degas-ui/package-lock.json

      - name: Install the locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker:
    name: Docker stack
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      COMPOSE_FILE: compose.yaml:compose.local.yaml
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the images
        run: docker compose build

      - name: Start the stack
        run: docker compose up --detach --no-build

      - name: Wait for the API behind the web server
        run: |
          for _ in $(seq 60); do
            if curl -fsS -m 2 http://localhost:3000/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Check the web interface is served
        run: curl -fsS http://localhost:3000/ | grep -q '<div id="root"></div>'

      - name: Check the API command line
        run: docker compose run --rm --no-deps api version

      - name: Show the service logs
        if: failure()
        run: docker compose logs --no-color

  all-green:
    name: All checks passed
    if: always()
    needs: [changes, lint, pydegas, api, ui, docker]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Decide whether the needed jobs succeeded
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: pydegas, api, ui, docker
