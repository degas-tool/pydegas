minimum_pre_commit_version: "4.0.0"

exclude: |
  (?x)^(
      reference/
    | libs/pydegas/src/pydegas/parse/(soga|asgmt|trunc|degas-loss)/
    | libs/degas-ui/public/plotly\.js$
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-json
        exclude: ^libs/degas-ui/tsconfig(\.[a-z]+)?\.json$
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos
        args: [--force-exclude]

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.8
    hooks:
      - id: uv-lock
        name: uv lock (pydegas)
        files: ^libs/pydegas/(pyproject\.toml|uv\.lock)$
        args: [--project, libs/pydegas]
      - id: uv-lock
        name: uv lock (degas-api)
        files: ^libs/degas-api/(pyproject\.toml|uv\.lock)$
        args: [--project, libs/degas-api]

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject
        files: ^libs/[^/]+/pyproject\.toml$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint
        args: [--failure-threshold, warning]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-compose-spec
      - id: check-github-workflows
      - id: check-github-workflows-require-timeout

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint
        additional_dependencies: [shellcheck-py==0.11.0.1]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor

  - repo: local
    hooks:
      - id: mypy-pydegas
        name: mypy (pydegas)
        language: system
        entry: uv run --directory libs/pydegas --frozen mypy
        files: ^libs/pydegas/(src|tests)/.+\.pyi?$|^libs/pydegas/pyproject\.toml$
        pass_filenames: false
        require_serial: true
      - id: mypy-degas-api
        name: mypy (degas-api)
        language: system
        entry: uv run --directory libs/degas-api --frozen mypy
        files: ^libs/degas-api/(src|scripts|tests)/.+\.pyi?$|^libs/degas-api/pyproject\.toml$
        pass_filenames: false
        require_serial: true
      - id: prettier
        name: prettier (degas-ui)
        language: system
        entry: libs/degas-ui/node_modules/.bin/prettier --write --ignore-unknown
        files: ^libs/degas-ui/
        types_or: [ts, tsx, javascript, css, html, json]
        exclude: ^libs/degas-ui/(package-lock\.json|public/)
      - id: eslint
        name: eslint (degas-ui)
        language: system
        entry: npm --prefix libs/degas-ui run --silent lint
        files: ^libs/degas-ui/(src/.+\.(ts|tsx)|eslint\.config\.js|package\.json)$
        pass_filenames: false
      - id: tsc
        name: tsc (degas-ui)
        language: system
        entry: npm --prefix libs/degas-ui run --silent typecheck
        files: ^libs/degas-ui/(src/.+\.(ts|tsx)|tsconfig.*\.json|vite\.config\.ts|package\.json)$
        pass_filenames: false
