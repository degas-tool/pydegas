map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Local stand-in for Caddy: route the API and the run WebSocket to the api service.
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host localhost;
    }

    location /docs {
        proxy_pass http://api:8000/docs;
        proxy_set_header Host localhost;
    }

    # Swagger UI fetches the schema from the root, which would otherwise fall
    # through to index.html and be parsed as YAML.
    location /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host localhost;
    }

    location / {
        try_files $uri /index.html;
    }
}
