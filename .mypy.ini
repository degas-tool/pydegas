[mypy]
implicit_optional = True
ignore_missing_imports = True
show_error_codes = True

follow_imports = silent
warn_redundant_casts = True
warn_unused_ignores = True
check_untyped_defs = True
implicit_reexport = True

# ANTLR-generated files use `from antlr4 import *` which mypy cannot resolve.
# These files are never edited by hand so type-checking them is noise.
[mypy-pydegas.parse.soga.*]
ignore_errors = True
[mypy-pydegas.parse.asgmt.*]
ignore_errors = True
[mypy-pydegas.parse.trunc.*]
ignore_errors = True
