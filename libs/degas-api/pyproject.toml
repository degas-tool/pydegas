[project]
name = "degas-api"
version = "0.0.0"
description = "FastAPI service that streams pydegas optimization runs over a WebSocket and stores them as sessions."
readme = "README.md"
authors = [{ name = "Oguzhan Merttürk" }, { name = "Francesca Randone" }]
requires-python = ">=3.12"
classifiers = [
    "Private :: Do Not Upload",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "apscheduler>=3.10,<4",
    "fastapi>=0.136.1,<1",
    "loguru>=0.7.3,<0.8",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "pydegas",
    "python-dotenv>=1.0,<2",
    "redis>=7.4.0,<8",
    "sqlalchemy>=2.0,<3",
    "sqlmodel>=0.0.22,<0.1",
    "starlette>=0.46,<2",
    "torch>=2.0,<3",
    "uvicorn[standard]>=0.46,<1",
    "websockets>=16.0,<17",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.18,<2",
    "numpy>=1.26",
    "pytest>=8.4",
    "ruff==0.17.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
pydegas = { path = "../pydegas", editable = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "tests"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
